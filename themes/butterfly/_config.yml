# 文章列表样式（设置为index可以让分类页和标签页的文章列表跟主页一样，留空则跟归档页一样）
category_ui:
tag_ui:

# 界面组件圆角样式（true：开启圆角，false：关闭圆角）
rounded_corners_ui: true

# 文本行两端对齐
text_align_justify: true

# 头部页脚遮蔽色
mask:
  header: true
  footer: true

# 预加载动画配置
preloader:
  enable: false
  # source
  # 1. fullpage-loading
  # 2. pace (progress bar)
  source: 1
  # pace theme (see https://codebyzach.github.io/pace/)
  pace_css_url:

# 页面的过渡动画，Page Transition，开启的话也需要开启Pjax才有效
enter_transitions: true

# 默认的明暗模式 - light (default) / dark
display_mode: light

# 页面的美化增强，Configuration for beautifying the content of the article
beautify:
  enable: false
  # Specify the field to beautify (site or post)
  field: post
  # Specify the icon to be used as a prefix for the title, such as '\f0c1'
  title_prefix_icon:
  # Specify the color of the title prefix icon, such as '#F47466'
  title_prefix_icon_color:

# 全局的字体设置，Global font settings，不在这里修改，后续魔改再来分析
# Don't modify the following settings unless you know how they work
font:
  global_font_size:
  code_font_size:
  font_family:
  code_font_family:
# 标题专用的字体，不在这里进行配置
# Font settings for the site title and site subtitle
blog_title_font:
  font_link:
  font_family:

# 分割线图标设置，没啥改头，先随便换个图标
hr_icon:
  enable: true
  # The unicode value of Font Awesome icon, such as '\3423'
  icon: '\f0c4' # 填入FontAwesome图标的Unicode编码，格式示例：'\f0c4'
  icon_top:

# 打字的火花特效
# https://github.com/disjukr/activate-power-mode
activate_power_mode:
  enable: true   # 总开关
  colorful: true # true：彩色火花粒子，false：单色粒子
  shake: false   # 屏幕震动效果
  mobile: true   # 移动端是否开启

# 背景特效，彩带飘带
# See: https://github.com/hustcc/ribbon.js
canvas_ribbon:
  enable: false
  # The size of ribbon
  size: 150
  # The opacity of ribbon (0 ~ 1)
  alpha: 0.6
  zIndex: -1
  click_to_change: false
  mobile: false
# 背景特效，飘动丝带
canvas_fluttering_ribbon:
  enable: false
  mobile: false
# 背景特效，鼠标连线粒子
# https://github.com/hustcc/canvas-nest.js
canvas_nest:
  enable: true
  color: '0,0,255' # 线条RGB颜色，蓝色
  opacity: 0.7     # 线条透明度
  # The z-index property of the background
  zIndex: -1
  # The number of lines
  count: 199       # 粒子数量，数字越大越耗性能
  mobile: true     # 移动端

# 鼠标点击烟花特效
fireworks:
  enable: false
  zIndex: 9999
  mobile: false
# 鼠标点击爱心特效
click_heart:
  enable: true
  mobile: true
# 鼠标点击文字特效
clickShowText:
  enable: false
  text:
    # - I
    # - LOVE
    # - YOU
  fontSize: 15px
  random: false
  mobile: false


# ------------------------------------------------------------- Other Settings ------------------------------------------------------------------ #
# https://github.com/MoOx/pjax
pjax:
  # 总开关
  enable: true
  # 排除的页面，列表内的页面被访问时，会强制整页刷新，不使用 Pjax，such as '/music/'
  exclude:
    # - /xxxxxx/

# 音乐播放器 Aplayer
# Inject the css and script (aplayer/meting)
aplayerInject:
  enable: false  # 总开关
  per_page: true # true:只有页面检测到存在嵌入式播放器代码才加载播放器脚本；false:所有页面一律强制加载播放器资源

# Snackbar - Toast Notification
# https://github.com/polonel/SnackBar
# position: top-left / top-center / top-right / bottom-left / bottom-center / bottom-right
snackbar:
  enable: true        # 总开关
  position: top-right # top-left / top-center / top-right / bottom-left / bottom-center / bottom-right
  bg_light: '#49b1f5' # 浅色模式时的弹窗背景
  bg_dark: '#1f1f1f'  # 深色模式时的弹窗背景

# 当鼠标悬停到链接上超过65毫秒时，Instantpage会对该链接进行预加载
# 可以提升访问速度，但是只要鼠标划过就加载，浪费资源
# Instant.page
# https://instant.page/1
instantpage: false

# 图片懒加载，Lazyload
# https://github.com/verlok/vanilla-lazyload
lazyload:
  enable: true # 总开关
  native: true # 使用浏览器原生懒加载
  field: post  # 只对文章页的图片生效
  placeholder: # 占位图片地址，留空则使用默认空白占位
  blur: true   # 启用模糊渐进加载，如果不启用图片加载完成就直接出现

